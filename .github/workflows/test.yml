name: Test

on:
  push:
    branches:
      - main
      - develop
      - 'test/**'
      - 'feature/**'
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the run in flight redundant.
concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      # Report every version rather than stopping at the first one that breaks.
      fail-fast: false
      matrix:
        node-version:
          - 18.x
          - 20.x
          - 22.x

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check the source and the tests
        run: npm run typecheck

      - name: Run the tests
        # test:ci applies the commit-and-tag-version patch and then runs mocha. It is used in place
        # of `npm test` so that the `posttest` lint step does not run here - the repository's eslint
        # configuration predates the TypeScript sources and cannot currently parse them.
        run: npm run test:ci
