# https://taskfile.dev
#
# The tasks here drive the toolchain with npm. Do not swap them over to pnpm: `oclif pack tarballs`
# picks its package manager from the lockfiles in this directory, and a pnpm-lock.yaml next to a
# pnpm-workspace.yaml makes it install the tarball dependencies into a workspace that pnpm then
# leaves empty. v1.15.0 and v1.16.0 shipped with no node_modules in them for exactly that reason.
# See the "Package manager" section of CLAUDE.md.

version: '3'

vars:
  # Every platform that gets published. Override it for a quick single-platform build:
  #   task build TARGETS=linux-x64
  TARGETS: linux-x64,linux-arm,linux-arm64,win32-x64,win32-arm64,darwin-x64,darwin-arm64

tasks:
  default:
    desc: List the tasks in this file
    cmds:
      - task --list
    silent: true

  init:
    desc: Install the dependencies from package-lock.json
    cmds:
      - |
        for file in pnpm-lock.yaml pnpm-workspace.yaml; do
          if [ -e "$file" ]; then
            echo "Warning: $file is in the repository root. It is gitignored, so it will not be"
            echo "committed, but delete it before you build the binaries by hand - it is what broke"
            echo "the v1.15.0 and v1.16.0 releases. 'task build' moves it aside on your behalf."
          fi
        done
      - npm ci

  compile:
    desc: Compile the TypeScript into dist/
    cmds:
      - npm run build

  build:
    # generate:main is the pipeline the release itself uses - compile, write the oclif manifest and
    # the README, then pack. TARGETS reaches scripts/pack-tarballs.sh through the environment.
    desc: Build the release binaries for every platform into dist/
    cmds:
      - TARGETS={{.TARGETS}} npm run generate:main

  typecheck:
    desc: Type check the source and the tests
    cmds:
      - npm run typecheck

  test:
    desc: Apply the patches and run the test suite
    cmds:
      - npm run test:ci
